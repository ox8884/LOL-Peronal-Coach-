name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: ruff
        run: python -m ruff check .

      - name: mypy
        run: python -m mypy src/lol_coach

      - name: pytest (non-GUI)
        run: >-
          python -m pytest -q
          --ignore=tests/test_gui_smoke.py
          --ignore=tests/test_me_tab_virtual.py
          --ignore=tests/test_tierlist_virtual.py
          -k "not test_virtual_rows_reuses_bounded_slots_with_real_tk"

      # Tk/CTk 전역 상태가 다른 테스트의 Tcl 초기화에 남지 않도록 프로세스를 분리한다.
      - name: pytest (isolated GUI)
        shell: pwsh
        run: |
          $collected = @(python -m pytest --collect-only -q tests/test_gui_smoke.py tests/test_me_tab_virtual.py tests/test_tierlist_virtual.py tests/test_virtual_rows.py::test_virtual_rows_reuses_bounded_slots_with_real_tk)
          if ($LASTEXITCODE -ne 0) { $collected; exit $LASTEXITCODE }
          $guiTests = @($collected | Where-Object { $_ -match '^tests[/\\].+::' })
          if ($guiTests.Count -eq 0) { throw 'No GUI tests collected' }
          foreach ($nodeId in $guiTests) {
            python -m pytest -q $nodeId
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
